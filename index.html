<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Escape Hunter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Ccircle cx='25' cy='32' r='10' fill='%23ffb13a'/%3E%3Crect x='40' y='22' width='16' height='20' rx='4' fill='%232fbf71'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0a0f18;
    --panel: #121c2b;
    --panel-soft: #16202f;
    --panel-lift: #1d2a3d;
    --edge: #26344c;
    --edge-strong: #344766;
    --text: #eaf0fb;
    --muted: #8fa3c4;
    --accent: #5ad1ff;
    --win: #57e39b;
    --lose: #ff7b8a;
    --amber: #ffb13a;
    --violet: #a76fff;
    --green: #66fa9f;
    --shadow: 0 18px 40px rgba(0, 0, 0, .35);
    --radius: 20px;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    font-family: var(--font);
    color: var(--text);
    background:
      radial-gradient(1200px 700px at 12% -12%, #16233a 0%, rgba(22, 35, 58, 0) 60%),
      radial-gradient(900px 640px at 98% 8%, #221733 0%, rgba(34, 23, 51, 0) 55%),
      linear-gradient(160deg, #0a101b 0%, #090e16 48%, #0c0a16 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    width: min(1100px, 100%);
    min-height: 100svh;
    margin: 0 auto;
    padding: clamp(14px, 2.2vw, 28px) clamp(14px, 2.4vw, 30px);
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1.5vh, 16px);
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .brand {
    flex: 1 1 260px;
    min-width: 200px;
  }

  h1 {
    margin: 0;
    font-size: clamp(24px, 3.2vw, 32px);
    font-weight: 800;
    letter-spacing: .012em;
    line-height: 1.1;
  }

  .subtitle {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .turn {
    min-width: 92px;
    padding: 7px 16px 5px;
    border: 1px solid var(--edge);
    border-radius: 14px;
    background: linear-gradient(180deg, #1a2537, #121b29);
    text-align: center;
  }

  .turn .label {
    display: block;
    font-size: 10px;
    letter-spacing: .18em;
    color: var(--muted);
  }

  .turn .value {
    display: block;
    font-size: 28px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .select { position: relative; }

  select, button {
    font: inherit;
    font-size: 15px;
    color: var(--text);
    background: var(--panel-soft);
    border: 1px solid var(--edge);
    border-radius: 12px;
    padding: 12px 18px;
    transition: background .15s ease, border-color .15s ease, transform .06s ease;
  }

  select {
    appearance: none;
    padding-right: 40px;
    cursor: pointer;
  }

  select:hover, button:hover {
    background: var(--panel-lift);
    border-color: var(--edge-strong);
  }

  select:focus-visible, button:focus-visible, input:focus-visible, canvas:focus-visible {
    outline: 2px solid rgba(90, 209, 255, .75);
    outline-offset: 2px;
  }

  button { cursor: pointer; }
  button:active { transform: translateY(1px); }

  .chev {
    position: absolute;
    top: 50%;
    right: 16px;
    width: 0;
    height: 0;
    margin-top: -2px;
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-top: 6px solid var(--muted);
    font-size: 0;
    pointer-events: none;
  }

  /* ---- setup panel ---- */

  .setup {
    border: 1px solid var(--edge);
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(22, 32, 47, .72), rgba(17, 26, 39, .6));
  }

  .setup > summary {
    display: none;
    list-style: none;
    cursor: pointer;
    align-items: baseline;
    gap: 10px;
    padding: 11px 14px;
  }

  .setup > summary::-webkit-details-marker { display: none; }

  .setup > summary .setup-label {
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
  }

  .setup > summary .setup-summary {
    color: var(--muted);
    font-size: 12.5px;
  }

  .setup[open] > summary { border-bottom: 1px solid rgba(38, 52, 76, .65); }

  .setup-body {
    display: flex;
    align-items: flex-end;
    gap: 14px;
    flex-wrap: wrap;
    padding: 10px 14px 11px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }

  .field > span {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 10px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .select.compact select {
    padding: 8px 30px 8px 12px;
    font-size: 14px;
    border-radius: 10px;
    min-width: 72px;
  }

  .select.compact .chev { right: 12px; }

  .walls-field {
    flex: 1 1 160px;
    max-width: 260px;
    min-width: 140px;
  }

  .walls-field input[type="range"] {
    width: 100%;
    margin: 2px 0 3px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .walls-field output {
    color: var(--text);
    font-weight: 600;
    letter-spacing: .02em;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }

  #apply {
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    border-color: #3b6f9e;
    background: linear-gradient(180deg, #244a6e, #1c3b59);
    white-space: nowrap;
  }

  #apply:hover {
    background: linear-gradient(180deg, #2c5a86, #21466a);
    border-color: #4d86ba;
  }

  .setup-hint {
    margin: 0 0 5px auto;
    font-size: 11.5px;
    color: var(--muted);
    white-space: nowrap;
  }

  .board-wrap {
    flex: 1 1 auto;
    min-height: 300px;
    display: grid;
    place-items: center;
  }

  .touchpad {
    display: none;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    gap: 8px;
    justify-content: center;
    margin: 0 auto;
  }

  .touchpad button {
    display: grid;
    place-items: center;
    padding: 0;
    font-size: 16px;
    color: var(--muted);
    background: var(--panel-soft);
    border: 1px solid var(--edge);
    border-radius: 16px;
    touch-action: manipulation;
  }

  .touchpad button:active {
    background: var(--panel-lift);
    color: var(--text);
  }

  .touchpad .up { grid-area: 1 / 2; }
  .touchpad .left { grid-area: 2 / 1; }
  .touchpad .down { grid-area: 3 / 2; }
  .touchpad .right { grid-area: 2 / 3; }

  .board-frame {
    position: relative;
    width: min(100%, calc(100svh - 285px));
    aspect-ratio: 1 / 1;
    max-width: 100%;
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    background: linear-gradient(180deg, #0c1119, #0a0f17);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .03);
    overflow: hidden;
  }

  canvas {
    position: absolute;
    left: 10px;
    top: 10px;
    width: calc(100% - 20px);
    height: calc(100% - 20px);
    display: block;
    touch-action: none;
    border-radius: 12px;
    cursor: default;
  }

  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px 18px;
    flex-wrap: wrap;
    color: var(--muted);
    font-size: 13.5px;
  }

  #status {
    margin: 0;
    flex: 1 1 300px;
    min-width: 0;
  }

  .tally {
    margin: 0;
    white-space: nowrap;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }

  .tally b {
    color: var(--text);
    font-weight: 600;
  }

  .legend {
    margin: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    white-space: nowrap;
    font-size: 12.5px;
  }

  .legend span.item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .swatch {
    display: inline-grid;
    place-items: center;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    font-size: 10px;
    font-weight: 800;
    color: #0b1019;
  }

  .swatch.hunter { background: var(--amber); }
  .swatch.fugitive { background: var(--violet); }
  .swatch.exit { background: #1a5c40; color: var(--green); box-shadow: inset 0 0 0 1px rgba(102, 250, 159, .8); }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(3, 6, 11, .72);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .18s ease, visibility .18s ease;
  }

  .overlay.open {
    opacity: 1;
    visibility: visible;
  }

  .card {
    width: min(460px, 100%);
    padding: 34px 32px 30px;
    border: 1px solid var(--edge-strong);
    border-radius: 24px;
    background: linear-gradient(180deg, #182234, #131c2a);
    box-shadow: 0 30px 70px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .04);
    text-align: center;
    transform: translateY(10px) scale(.97);
    transition: transform .24s cubic-bezier(.2, .9, .3, 1.05);
  }

  .overlay.open .card { transform: none; }

  .card h2 {
    margin: 0 0 10px;
    font-size: clamp(32px, 6vw, 40px);
    letter-spacing: .02em;
    color: var(--win);
  }

  .card.lose h2 { color: var(--lose); }

  .card p {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.55;
  }

  button.primary {
    background: linear-gradient(180deg, #2a7fd4, #1f66b3);
    border-color: #4a9ae8;
    font-weight: 600;
    padding: 13px 26px;
  }

  button.primary:hover {
    background: linear-gradient(180deg, #338ce4, #2472c4);
    border-color: #63b0f5;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  @media (max-width: 760px) {
    .controls {
      width: 100%;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px;
    }
    .turn { min-width: 84px; padding-left: 10px; padding-right: 10px; }
    .select { min-width: 0; }
    .select select { width: 100%; padding-left: 14px; padding-right: 34px; }
    .setup { gap: 0; }
    .setup > summary { display: flex; }
    .setup-body { gap: 10px; padding: 10px 14px 12px; }
    .field { flex: 1 1 90px; }
    .walls-field { flex: 1 1 100%; max-width: none; }
    #apply { flex: 1 1 100%; }
    .setup-hint { display: none; }
    .board-wrap { flex: 0 0 auto; min-height: 0; }
    .board-frame { width: min(100%, 360px); }
    .touchpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); }
    footer { font-size: 12.5px; }
    .legend { gap: 10px; }
  }

  @media (max-width: 420px) {
    .touchpad { grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); }
    h1 { font-size: 24px; }
  }
  @media (max-height: 560px) {
    .app { min-height: 0; }
    .board-wrap { min-height: 240px; height: 46vh; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1>ESCAPE HUNTER</h1>
        <p class="subtitle">Turn-based pursuit on a grid</p>
      </div>
      <div class="controls">
        <div class="turn" title="Round counter">
          <span class="label">ROUND</span>
          <span class="value" id="turn">1</span>
        </div>
        <div class="select">
          <label class="sr-only" for="difficulty">Fugitive difficulty</label>
          <select id="difficulty" title="Fugitive difficulty">
            <option value="0">Easy</option>
            <option value="1" selected>Normal</option>
            <option value="2">Hard</option>
            <option value="3">Expert</option>
          </select>
          <span class="chev" aria-hidden="true"></span>
        </div>
        <button id="restart" type="button" title="Restart with these settings (R)">Restart</button>
      </div>
    </header>

    <details class="setup" id="setup" open>
      <summary>
        <span class="setup-label">Setup</span>
        <span class="setup-summary" id="setup-summary">1 hunter &middot; 1 fugitive &middot; 40% walls</span>
      </summary>
      <div class="setup-body">
        <div class="field">
          <span>Hunters</span>
          <div class="select compact">
            <label class="sr-only" for="hunters">Number of hunters</label>
            <select id="hunters" title="Number of hunters">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
            <span class="chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="field">
          <span>Fugitives</span>
          <div class="select compact">
            <label class="sr-only" for="fugitives">Number of fugitives</label>
            <select id="fugitives" title="Number of fugitives">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
            <span class="chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="field walls-field">
          <span>Walls <output id="walls-value" for="walls">40%</output></span>
          <input id="walls" type="range" min="20" max="60" step="5" value="40" title="Wall coverage">
        </div>
        <button id="apply" type="button" title="Start a hunt with these settings">New hunt</button>
        <p class="setup-hint">Changes apply to the next hunt.</p>
      </div>
    </details>

    <main class="board-wrap">
      <div class="board-frame">
        <canvas id="board" role="img" aria-label="Game board. Move each hunter with the arrow keys or WASD."></canvas>
      </div>
    </main>

    <div class="touchpad" aria-label="Movement controls">
      <button class="up" type="button" data-move="up" aria-label="Move up">&#9650;</button>
      <button class="left" type="button" data-move="left" aria-label="Move left">&#9664;</button>
      <button class="down" type="button" data-move="down" aria-label="Move down">&#9660;</button>
      <button class="right" type="button" data-move="right" aria-label="Move right">&#9654;</button>
    </div>

    <footer>
      <p id="status" role="status" aria-live="polite">Move each hunter once, then the fugitives run.</p>
      <p class="tally" id="tally">Caught <b>0</b> / 1 &middot; Escaped <b>0</b></p>
      <p class="legend" aria-label="Legend">
        <span class="item"><span class="swatch hunter">H</span>Hunter</span>
        <span class="item"><span class="swatch fugitive">F</span>Fugitive</span>
        <span class="item"><span class="swatch exit">E</span>Exit</span>
      </p>
    </footer>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="card" id="result-card" role="dialog" aria-modal="true" aria-labelledby="result-title" aria-describedby="result-message">
      <h2 id="result-title">CAUGHT</h2>
      <p id="result-message">You caught every fugitive.</p>
      <button id="again" class="primary" type="button">Play Again</button>
    </div>
  </div>

<script>
(() => {
  'use strict';

  /* ------------------------------------------------------------------ *
   *  Rules, map generation and AI.
   *  No DOM access in this block, so it can also run under Node.
   * ------------------------------------------------------------------ */

  const COLS = 15;
  const ROWS = 15;
  const TILE = { WALL: 0, FLOOR: 1, EXIT: 2 };
  const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // up, right, down, left
  const AI = { EASY: 0, NORMAL: 1, HARD: 2, EXPERT: 3 };
  const DIFFICULTY = [
    { name: 'Easy', hint: 'Walks in random directions.' },
    { name: 'Normal', hint: 'Runs straight for the nearest exit.' },
    { name: 'Hard', hint: 'Keeps clear of the hunters.' },
    { name: 'Expert', hint: 'Reads the hunters three moves ahead.' }
  ];

  // Rounds until the fugitives stop dodging and commit to the exit.
  const URGENCY_TURNS = [8, 14, 20, 30];
  const MAX_ACTORS = 5;

  const TAU = Math.PI * 2;
  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
  const lerp = (a, b, t) => a + (b - a) * t;
  const same = (a, b) => a.x === b.x && a.y === b.y;
  const manhattan = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
  const chebyshev = (a, b) => Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));
  const idOf = (grid, cell) => cell.y * grid.w + cell.x;

  function makeRng(seed) {
    let state = seed >>> 0;
    return function random() {
      state = (state + 0x6D2B79F5) | 0;
      let t = Math.imul(state ^ (state >>> 15), 1 | state);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  class Grid {
    constructor(w = COLS, h = ROWS) {
      this.w = w;
      this.h = h;
      this.tiles = [];
      this.exits = [];
      this.reset();
    }

    reset() {
      this.tiles = Array.from({ length: this.h }, () => new Array(this.w).fill(TILE.FLOOR));
      this.exits = [];
      for (let x = 0; x < this.w; x++) {
        this.tiles[0][x] = TILE.WALL;
        this.tiles[this.h - 1][x] = TILE.WALL;
      }
      for (let y = 0; y < this.h; y++) {
        this.tiles[y][0] = TILE.WALL;
        this.tiles[y][this.w - 1] = TILE.WALL;
      }
    }

    inBounds(x, y) {
      return x >= 0 && y >= 0 && x < this.w && y < this.h;
    }

    isInterior(x, y) {
      return x > 0 && y > 0 && x < this.w - 1 && y < this.h - 1;
    }

    tile(x, y) {
      return this.inBounds(x, y) ? this.tiles[y][x] : TILE.WALL;
    }

    setTile(x, y, tile) {
      if (!this.inBounds(x, y)) return;
      this.tiles[y][x] = tile;
      if (tile === TILE.EXIT) {
        if (!this.exits.some((cell) => cell.x === x && cell.y === y)) {
          this.exits.push({ x, y });
        }
      } else {
        this.exits = this.exits.filter((cell) => !(cell.x === x && cell.y === y));
      }
    }

    isWall(x, y) { return this.tile(x, y) === TILE.WALL; }
    isWalkable(x, y) { return this.inBounds(x, y) && this.tiles[y][x] !== TILE.WALL; }
    isExit(x, y) { return this.tile(x, y) === TILE.EXIT; }

    walkableCells() {
      const cells = [];
      for (let y = 0; y < this.h; y++) {
        for (let x = 0; x < this.w; x++) {
          if (this.tiles[y][x] !== TILE.WALL) cells.push({ x, y });
        }
      }
      return cells;
    }

    interiorCells() {
      const cells = [];
      for (let y = 1; y < this.h - 1; y++) {
        for (let x = 1; x < this.w - 1; x++) cells.push({ x, y });
      }
      return cells;
    }

    neighbors(x, y) {
      const cells = [];
      for (const [dx, dy] of DIRS) {
        if (this.isWalkable(x + dx, y + dy)) cells.push({ x: x + dx, y: y + dy });
      }
      return cells;
    }

    loadLayout(rows) {
      if (!rows || rows.length < 5) return null;
      const width = rows[0].length;
      if (width < 5 || rows.some((row) => row.length !== width)) return null;
      this.w = width;
      this.h = rows.length;
      this.reset();
      const spawns = { hunter: null, fugitive: null };
      for (let y = 0; y < this.h; y++) {
        for (let x = 0; x < this.w; x++) {
          const glyph = rows[y][x];
          if (glyph === '#') this.tiles[y][x] = TILE.WALL;
          else if (glyph === 'E') this.setTile(x, y, TILE.EXIT);
          else if (glyph === 'H') spawns.hunter = { x, y };
          else if (glyph === 'F') spawns.fugitive = { x, y };
        }
      }
      return spawns;
    }
  }

  class Pathfinding {
    /** A* route from start (exclusive) to goal (inclusive); [] if unreachable. */
    static findPath(grid, start, goal, blocked = []) {
      if (same(start, goal)) return [];
      const blockedSet = new Set();
      for (const cell of blocked) blockedSet.add(idOf(grid, cell));
      const goalId = idOf(grid, goal);
      if (!grid.isWalkable(goal.x, goal.y) || blockedSet.has(goalId)) return [];

      const startId = idOf(grid, start);
      const open = [startId];
      const inOpen = new Set(open);
      const closed = new Set();
      const cameFrom = new Map();
      const cost = new Map([[startId, 0]]);
      const estimate = new Map([[startId, manhattan(start, goal)]]);

      while (open.length > 0) {
        let bestIndex = 0;
        for (let i = 1; i < open.length; i++) {
          if (estimate.get(open[i]) < estimate.get(open[bestIndex])) bestIndex = i;
        }
        const current = open.splice(bestIndex, 1)[0];
        if (closed.has(current)) continue;
        closed.add(current);
        if (current === goalId) return Pathfinding._reconstruct(cameFrom, current, grid);

        const point = { x: current % grid.w, y: Math.floor(current / grid.w) };
        for (const next of grid.neighbors(point.x, point.y)) {
          const nextId = idOf(grid, next);
          if (blockedSet.has(nextId) || closed.has(nextId)) continue;
          const nextCost = cost.get(current) + 1;
          if (nextCost < (cost.get(nextId) ?? Infinity)) {
            cost.set(nextId, nextCost);
            cameFrom.set(nextId, current);
            estimate.set(nextId, nextCost + manhattan(next, goal));
            if (!inOpen.has(nextId)) {
              open.push(nextId);
              inOpen.add(nextId);
            }
          }
        }
      }
      return [];
    }

    /** BFS flood fill; returns Map<cellId, steps> from the closest origin. */
    static distanceField(grid, origins, blocked = []) {
      const blockedSet = new Set();
      for (const cell of blocked) blockedSet.add(idOf(grid, cell));

      const distances = new Map();
      const frontier = [];
      for (const origin of origins) {
        const originId = idOf(grid, origin);
        if (grid.isWalkable(origin.x, origin.y) && !blockedSet.has(originId) && !distances.has(originId)) {
          distances.set(originId, 0);
          frontier.push(originId);
        }
      }

      let head = 0;
      while (head < frontier.length) {
        const current = frontier[head++];
        const point = { x: current % grid.w, y: Math.floor(current / grid.w) };
        const distance = distances.get(current);
        for (const next of grid.neighbors(point.x, point.y)) {
          const nextId = idOf(grid, next);
          if (blockedSet.has(nextId) || distances.has(nextId)) continue;
          distances.set(nextId, distance + 1);
          frontier.push(nextId);
        }
      }
      return distances;
    }

    static nextStep(grid, from, goal, blocked = []) {
      const path = Pathfinding.findPath(grid, from, goal, blocked);
      return path.length > 0 ? path[0] : from;
    }

    static isReachable(grid, from, goal, blocked = []) {
      return same(from, goal) || Pathfinding.findPath(grid, from, goal, blocked).length > 0;
    }

    static _reconstruct(cameFrom, currentId, grid) {
      const path = [];
      while (cameFrom.has(currentId)) {
        path.push({ x: currentId % grid.w, y: Math.floor(currentId / grid.w) });
        currentId = cameFrom.get(currentId);
      }
      path.reverse();
      return path;
    }
  }

  class MapGenerator {
    static get MAX_ATTEMPTS() { return 80; }
    static get MIN_OPEN_CELLS() { return 40; }
    static get MIN_GAP() { return 6; }

    static generate(grid, rng, settings) {
      const density = clamp(settings.walls / 100, 0.2, 0.6);
      for (let attempt = 0; attempt < MapGenerator.MAX_ATTEMPTS; attempt++) {
        MapGenerator._carve(grid, rng, density);
        if (!MapGenerator._isPlayable(grid, settings)) continue;
        const spawns = MapGenerator._placeActors(grid, rng, settings);
        if (spawns) return spawns;
      }
      return MapGenerator._fallback(grid, settings);
    }

    static _carve(grid, rng, density) {
      grid.reset();
      for (const cell of grid.interiorCells()) {
        if (rng() < density) grid.setTile(cell.x, cell.y, TILE.WALL);
      }
      MapGenerator._connect(grid);
    }

    /** Join every disconnected pocket with a 4-neighbour tunnel. */
    static _connect(grid) {
      for (let pass = 0; pass < 500; pass++) {
        const open = grid.walkableCells();
        if (open.length === 0) return;

        const main = new Set([idOf(grid, open[0])]);
        const flood = [open[0]];
        while (flood.length > 0) {
          const cell = flood.pop();
          for (const next of grid.neighbors(cell.x, cell.y)) {
            const nextId = idOf(grid, next);
            if (main.has(nextId)) continue;
            main.add(nextId);
            flood.push(next);
          }
        }

        const orphan = open.find((cell) => !main.has(idOf(grid, cell)));
        if (!orphan) return;

        const previous = new Map();
        const queue = [];
        for (const id of main) {
          previous.set(id, -1);
          queue.push(id);
        }

        let target = -1;
        for (let head = 0; head < queue.length && target < 0; head++) {
          const current = queue[head];
          const point = { x: current % grid.w, y: Math.floor(current / grid.w) };
          for (const [dx, dy] of DIRS) {
            const nx = point.x + dx;
            const ny = point.y + dy;
            if (!grid.isInterior(nx, ny)) continue;
            const nextId = ny * grid.w + nx;
            if (previous.has(nextId)) continue;
            previous.set(nextId, current);
            queue.push(nextId);
            if (nx === orphan.x && ny === orphan.y) {
              target = nextId;
              break;
            }
          }
        }
        if (target < 0) return;

        let id = target;
        while (id !== -1) {
          const cell = { x: id % grid.w, y: Math.floor(id / grid.w) };
          if (grid.isWall(cell.x, cell.y)) grid.setTile(cell.x, cell.y, TILE.FLOOR);
          id = previous.get(id);
        }
      }
    }

    static _isPlayable(grid, settings) {
      const open = grid.walkableCells();
      const actors = settings.hunters + settings.fugitives;
      if (open.length < Math.max(MapGenerator.MIN_OPEN_CELLS, actors + 8)) return false;

      const seen = new Set([idOf(grid, open[0])]);
      const frontier = [open[0]];
      while (frontier.length > 0) {
        const cell = frontier.pop();
        for (const next of grid.neighbors(cell.x, cell.y)) {
          const nextId = idOf(grid, next);
          if (seen.has(nextId)) continue;
          seen.add(nextId);
          frontier.push(next);
        }
      }
      return seen.size === open.length;
    }

    static _placeActors(grid, rng, settings) {
      const open = grid.walkableCells();
      const total = settings.hunters + settings.fugitives;
      if (open.length < total + 1) return null;

      const exitCell = open[Math.floor(rng() * open.length)];
      grid.setTile(exitCell.x, exitCell.y, TILE.EXIT);
      const pool = open.filter((cell) => !same(cell, exitCell));

      // Try to keep the fugitives away from the hunters and the exit; relax the
      // gap if the chosen wall density leaves little room.
      for (let gap = MapGenerator.MIN_GAP; gap >= 0; gap -= 2) {
        for (let attempt = 0; attempt < 300; attempt++) {
          const shuffled = MapGenerator._shuffled(pool, rng);
          const cops = shuffled.slice(0, settings.hunters);
          const fugitives = shuffled.slice(settings.hunters, total);
          if (gap > 0 && !MapGenerator._spaced(fugitives, cops, exitCell, gap)) continue;
          return { cops, fugitives };
        }
      }

      const shuffled = MapGenerator._shuffled(pool, rng);
      return {
        cops: shuffled.slice(0, settings.hunters),
        fugitives: shuffled.slice(settings.hunters, total)
      };
    }

    static _spaced(fugitives, cops, exitCell, gap) {
      // Don't let a hunter start on the exit's doorstep: it would turn every
      // hunt into a camping exercise.
      for (const cop of cops) {
        if (manhattan(cop, exitCell) < 2) return false;
      }
      // At least one hunter should be nearer the exit than every fugitive, so
      // cutting the escape off is a real plan rather than a hopeless race.
      let closestCop = Infinity;
      for (const cop of cops) closestCop = Math.min(closestCop, manhattan(cop, exitCell));

      for (const fugitive of fugitives) {
        if (manhattan(fugitive, exitCell) < gap) return false;
        if (closestCop >= manhattan(fugitive, exitCell)) return false;
        for (const cop of cops) {
          if (manhattan(fugitive, cop) < gap) return false;
        }
      }
      return true;
    }

    static _fallback(grid, settings) {
      grid.reset();
      const exitCell = { x: Math.floor(grid.w / 2), y: grid.h - 2 };
      grid.setTile(exitCell.x, exitCell.y, TILE.EXIT);
      const cops = [];
      const fugitives = [];
      for (let i = 0; i < settings.hunters; i++) cops.push({ x: 1, y: 1 + i * 2 });
      for (let i = 0; i < settings.fugitives; i++) fugitives.push({ x: grid.w - 2, y: 1 + i * 2 });
      return { cops, fugitives };
    }

    static _shuffled(cells, rng) {
      const out = cells.slice();
      for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        const tmp = out[i];
        out[i] = out[j];
        out[j] = tmp;
      }
      return out;
    }
  }

  class FugitiveAI {
    constructor(difficulty = AI.NORMAL) {
      this.difficulty = difficulty;
      this.recent = [];
      this.random = Math.random;
    }

    reset() {
      this.recent = [];
    }

    chooseMove(grid, cops, fugitive, others, round = 0) {
      const blocked = [];
      for (const cop of cops) blocked.push(cop);
      for (const other of others) {
        if (other.status === 'active' && !same(other, fugitive)) blocked.push(other);
      }

      const options = this._legalMoves(grid, fugitive, blocked);
      if (options.length === 0) return fugitive;

      const exitField = Pathfinding.distanceField(grid, grid.exits, blocked);
      const urgency = clamp(round / (URGENCY_TURNS[this.difficulty] || 20), 0, 1);

      let choice;
      switch (this.difficulty) {
        case AI.EASY:
          choice = this._randomMove(options);
          break;
        case AI.HARD:
          choice = this._cautiousMove(grid, options, exitField, cops, urgency);
          break;
        case AI.EXPERT:
          choice = this._expertMove(grid, options, exitField, cops, fugitive, urgency);
          break;
        default:
          choice = this._greedyMove(grid, options, exitField);
      }

      this._remember(fugitive);
      return choice;
    }

    _legalMoves(grid, fugitive, blocked) {
      const moves = [];
      for (const cell of grid.neighbors(fugitive.x, fugitive.y)) {
        if (blocked.some((actor) => same(actor, cell))) continue;
        moves.push(cell);
      }
      return moves;
    }

    _remember(cell) {
      this.recent.push({ x: cell.x, y: cell.y });
      if (this.recent.length > 4) this.recent.shift();
    }

    _wasRecent(cell) {
      return this.recent.some((past) => same(past, cell));
    }

    _randomMove(options) {
      return options[Math.floor(this.random() * options.length)];
    }

    _greedyMove(grid, options, exitField) {
      let best = [];
      let bestScore = Infinity;
      for (const cell of options) {
        const distance = exitField.get(idOf(grid, cell)) ?? Infinity;
        const score = distance + (this._wasRecent(cell) ? 1.5 : 0);
        if (score < bestScore - 1e-9) {
          bestScore = score;
          best = [cell];
        } else if (Math.abs(score - bestScore) < 1e-9) {
          best.push(cell);
        }
      }
      if (best.length === 0) return options[0];
      return best[Math.floor(this.random() * best.length)];
    }

    _cautiousMove(grid, options, exitField, cops, urgency) {
      const threatWeight = lerp(3, 0, urgency);
      let best = options[0];
      let bestScore = Infinity;
      for (const cell of options) {
        const distance = exitField.get(idOf(grid, cell)) ?? Infinity;
        let score = distance + this._threat(cell, cops) * threatWeight;
        if (this._wasRecent(cell)) score += 2 * (1 - urgency) + 1;
        if (score < bestScore) {
          bestScore = score;
          best = cell;
        }
      }
      return best;
    }

    _expertMove(grid, options, exitField, cops, fugitive, urgency) {
      let best = fugitive;
      let bestScore = -Infinity;
      for (const cell of options) {
        const score = this._scoreExpertCell(grid, cell, exitField, cops, urgency);
        if (score > bestScore) {
          bestScore = score;
          best = cell;
        }
      }
      return best;
    }

    _scoreExpertCell(grid, cell, exitField, cops, urgency) {
      if (grid.isExit(cell.x, cell.y)) return 10000;

      const route = this._nearestExitPath(grid, cell, cops);
      if (route.length === 0) return -10000;
      const distance = route.length;
      const survival = this._simulatePursuit(grid, cell, cops, exitField);
      const openness = grid.neighbors(cell.x, cell.y).length;
      const routes = this._routeOptions(grid, exitField, cell, cops, distance);

      let score = 0;
      score += survival * lerp(45, 0, urgency);
      score -= distance * lerp(7, 14, urgency);
      score += openness * 6 * (1 - urgency);
      score += routes * 9 * (1 - urgency);
      score -= this._threat(cell, cops) * 2 * (1 - urgency);
      if (openness <= 1) score -= 30 * (1 - urgency);
      if (this._threat(cell, cops) >= 12) score -= 150 * (1 - urgency);
      if (this._wasRecent(cell)) score -= 24 * (1 - urgency) + 3;
      return score;
    }

    _routeOptions(grid, exitField, cell, cops, distance) {
      let routes = 0;
      for (const next of grid.neighbors(cell.x, cell.y)) {
        if (cops.some((cop) => same(cop, next))) continue;
        const nextDistance = exitField.get(idOf(grid, next));
        if (nextDistance !== undefined && nextDistance <= distance + 1) routes += 1;
      }
      return routes;
    }

    _nearestExitPath(grid, from, cops) {
      let best = [];
      for (const exitCell of grid.exits) {
        const path = Pathfinding.findPath(grid, from, exitCell, cops);
        if (path.length === 0) continue;
        if (best.length === 0 || path.length < best.length) best = path;
      }
      return best;
    }

    _simulatePursuit(grid, start, cops, exitField) {
      let fugitive = start;
      const hunters = cops.map((cop) => ({ x: cop.x, y: cop.y }));
      for (let turn = 0; turn < 3; turn++) {
        for (const hunter of hunters) {
          const step = this._hunterStep(grid, hunter, fugitive);
          hunter.x = step.x;
          hunter.y = step.y;
          if (same(hunter, fugitive)) return turn;
        }
        fugitive = this._fleeStep(grid, fugitive, hunters, exitField);
        if (grid.isExit(fugitive.x, fugitive.y)) return 4;
      }
      return 3;
    }

    _hunterStep(grid, hunter, fugitive) {
      const path = Pathfinding.findPath(grid, hunter, fugitive);
      return path.length > 0 ? path[0] : hunter;
    }

    _fleeStep(grid, fugitive, cops, exitField) {
      const options = this._legalMoves(grid, fugitive, cops);
      if (options.length === 0) return fugitive;
      let best = fugitive;
      let bestScore = Infinity;
      for (const cell of options) {
        const distance = exitField.get(idOf(grid, cell)) ?? Infinity;
        const score = distance + this._threat(cell, cops) * 2;
        if (score < bestScore) {
          bestScore = score;
          best = cell;
        }
      }
      return best;
    }

    _threat(cell, cops) {
      let threat = 0;
      for (const cop of cops) {
        const distance = chebyshev(cell, cop);
        if (distance === 0) return 24;
        if (distance === 1) threat = Math.max(threat, 12);
        else if (distance === 2) threat = Math.max(threat, 4);
      }
      return threat;
    }
  }

  class Game {
    /** The fugitives lose every fifth round to exhaustion. */
    static get REST_INTERVAL() { return 5; }

    constructor(rng, settings) {
      this.rng = rng;
      this.settings = { ...settings };
      this.aiList = [];
      this.grid = null;
      this.cops = [];
      this.fugitives = [];
      this.round = 1;
      this.phase = 'cops';
      this.selectedCopId = null;
      this.caught = 0;
      this.escaped = 0;
      this.outcome = null;
      this.resting = false;
    }

    newGame(settings = this.settings) {
      this.settings = { ...settings };
      this.grid = new Grid();
      const spawns = MapGenerator.generate(this.grid, this.rng, this.settings);
      this.cops = spawns.cops.map((cell, index) => ({ id: `c${index}`, x: cell.x, y: cell.y, moved: false }));
      this.fugitives = spawns.fugitives.map((cell, index) => ({ id: `f${index}`, x: cell.x, y: cell.y, status: 'active', movedThisPhase: false }));
      this.aiList = this.fugitives.map(() => {
        const ai = new FugitiveAI(this.settings.difficulty);
        ai.random = this.rng;
        return ai;
      });
      this.round = 1;
      this.caught = 0;
      this.escaped = 0;
      this.outcome = null;
      this.phase = 'cops';
      this.selectedCopId = null;
      this.resting = false;
      this.beginRound();
      return this;
    }

    get totalFugitives() { return this.fugitives.length; }

    activeFugitives() {
      return this.fugitives.filter((fugitive) => fugitive.status === 'active');
    }

    copById(id) {
      return this.cops.find((cop) => cop.id === id) || null;
    }

    copAt(x, y) {
      return this.cops.find((cop) => cop.x === x && cop.y === y) || null;
    }

    fugitiveAt(x, y) {
      return this.activeFugitives().find((fugitive) => fugitive.x === x && fugitive.y === y) || null;
    }

    copTargets(cop) {
      const targets = [];
      for (const [dx, dy] of DIRS) {
        const x = cop.x + dx;
        const y = cop.y + dy;
        if (!this.grid.isWalkable(x, y)) continue;
        if (this.cops.some((other) => other !== cop && other.x === x && other.y === y)) continue;
        targets.push({ x, y });
      }
      return targets;
    }

    canCopMove(cop) {
      return this.copTargets(cop).length > 0;
    }

    beginRound() {
      this.phase = 'cops';
      for (const cop of this.cops) cop.moved = !this.canCopMove(cop);
      const next = this.cops.find((cop) => !cop.moved) || null;
      this.selectedCopId = next ? next.id : null;
      if (!this.selectedCopId) this.beginFugitivePhase();
    }

    selectCop(id) {
      if (this.phase !== 'cops') return false;
      const cop = this.copById(id);
      if (!cop || cop.moved) return false;
      this.selectedCopId = id;
      return true;
    }

    moveSelected(dx, dy) {
      if (this.phase !== 'cops') return { kind: 'ignored' };
      const cop = this.copById(this.selectedCopId);
      if (!cop || cop.moved) return { kind: 'ignored' };

      const target = { x: cop.x + dx, y: cop.y + dy };
      if (!this.grid.isWalkable(target.x, target.y)) return { kind: 'blocked' };
      if (this.cops.some((other) => other !== cop && same(other, target))) return { kind: 'blocked' };

      const victim = this.fugitiveAt(target.x, target.y);
      cop.x = target.x;
      cop.y = target.y;
      cop.moved = true;

      if (victim) {
        victim.status = 'caught';
        this.caught += 1;
      }

      if (this.activeFugitives().length === 0) {
        this.finish();
        return { kind: victim ? 'capture' : 'moved', captured: Boolean(victim), gameOver: true };
      }

      const next = this.cops.find((other) => !other.moved) || null;
      this.selectedCopId = next ? next.id : null;
      if (!this.selectedCopId) this.beginFugitivePhase();
      return { kind: victim ? 'capture' : 'moved', captured: Boolean(victim) };
    }

    beginFugitivePhase() {
      if (this.phase === 'over') return;
      this.phase = 'fugitives';
      this.resting = this.round % Game.REST_INTERVAL === 0;
      for (const fugitive of this.fugitives) fugitive.movedThisPhase = false;
    }

    nextFugitive() {
      return this.activeFugitives().find((fugitive) => !fugitive.movedThisPhase) || null;
    }

    stepFugitive() {
      if (this.phase !== 'fugitives' || this.resting) return null;
      const fugitive = this.nextFugitive();
      if (!fugitive) return null;

      const index = this.fugitives.indexOf(fugitive);
      const ai = this.aiList[index];
      const others = this.activeFugitives().filter((other) => other !== fugitive);
      const next = ai.chooseMove(this.grid, this.cops, fugitive, others, this.round);

      fugitive.movedThisPhase = true;
      if (same(next, fugitive)) return { kind: 'blocked', fugitive };

      fugitive.x = next.x;
      fugitive.y = next.y;
      if (this.grid.isExit(fugitive.x, fugitive.y)) {
        fugitive.status = 'escaped';
        this.escaped += 1;
        if (this.activeFugitives().length === 0) this.finish();
        return { kind: 'escaped', fugitive };
      }
      return { kind: 'moved', fugitive };
    }

    endFugitivePhase() {
      if (this.phase === 'over') return true;
      if (this.activeFugitives().length === 0) {
        this.finish();
        return true;
      }
      this.round += 1;
      this.beginRound();
      return this.phase === 'over';
    }

    finish() {
      this.phase = 'over';
      this.outcome = this.escaped === 0 ? 'cops' : 'fugitives';
    }

    setDifficulty(difficulty) {
      this.settings.difficulty = difficulty;
      for (const ai of this.aiList) ai.difficulty = difficulty;
    }
  }

  function shade(hex, factor) {
    const value = parseInt(hex.slice(1), 16);
    const r = clamp(Math.round(((value >> 16) & 255) * factor), 0, 255);
    const g = clamp(Math.round(((value >> 8) & 255) * factor), 0, 255);
    const b = clamp(Math.round((value & 255) * factor), 0, 255);
    return `rgb(${r}, ${g}, ${b})`;
  }

    const ctx = els.canvas.getContext('2d');

    const seeded = new URLSearchParams(window.location.search).get('seed');
    const rng = seeded !== null && seeded !== '' ? makeRng(Number(seeded) >>> 0) : Math.random;

    const view = {
      w: 0,
      h: 0,
      cell: 0,
      ox: 0,
      oy: 0,
      time: 0,
      copVisuals: new Map(),
      fugitiveVisuals: new Map(),
      nudge: { id: null, x: 0, y: 0 },
      hover: null,
      restFlash: 0
    };

    let game = null;
    let token = 0;
    let running = false;
    let phaseTimer = null;
    let lastRound = 1;
    let dragStart = null;
    let lastFrame = performance.now();

    function plural(one, many) {
      return game && game.totalFugitives === 1 ? one : many;
    }

    function readSettings() {
      return {
        hunters: clamp(Number(els.hunters.value) || 1, 1, MAX_ACTORS),
        fugitives: clamp(Number(els.fugitives.value) || 1, 1, MAX_ACTORS),
        walls: clamp(Number(els.walls.value) || 40, 20, 60),
        difficulty: clamp(Number(els.difficulty.value) || 0, 0, 3)
      };
    }

    function applySettingsToControls(settings) {
      els.hunters.value = String(settings.hunters);
      els.fugitives.value = String(settings.fugitives);
      els.walls.value = String(settings.walls);
      els.wallsValue.textContent = `${settings.walls}%`;
      els.difficulty.value = String(settings.difficulty);
    }

    function updateSetupSummary() {
      const current = readSettings();
      els.setupSummary.textContent =
        `${current.hunters} hunter${current.hunters === 1 ? '' : 's'} \u00b7 ` +
        `${current.fugitives} fugitive${current.fugitives === 1 ? '' : 's'} \u00b7 ` +
        `${current.walls}% walls`;
    }

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
        if (saved && typeof saved === 'object') {
          return {
            hunters: clamp(Number(saved.hunters) || 1, 1, MAX_ACTORS),
            fugitives: clamp(Number(saved.fugitives) || 1, 1, MAX_ACTORS),
            walls: clamp(Number(saved.walls) || 40, 20, 60),
            difficulty: clamp(Number(saved.difficulty) || 0, 0, 3)
          };
        }
      } catch (error) { /* storage unavailable */ }
      return { ...DEFAULT_SETTINGS };
    }

    function saveSettings(settings) {
      try {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      } catch (error) { /* storage unavailable */ }
    }

    function setStatus(text) {
      els.status.textContent = text;
    }

    function popRound() {
      if (typeof els.turn.animate === 'function') {
        els.turn.animate(
          [{ transform: 'scale(1)' }, { transform: 'scale(1.16)' }, { transform: 'scale(1)' }],
          { duration: 200, easing: 'ease-out' }
        );
      }
    }

    function updateHud() {
      if (!game) return;
      els.turn.textContent = String(game.round);
      if (game.round !== lastRound) {
        lastRound = game.round;
        popRound();
      }
      const active = game.activeFugitives().length;
      els.tally.innerHTML = `Caught <b>${game.caught}</b> / ${game.totalFugitives} &middot; Escaped <b>${game.escaped}</b>` +
        (active > 0 && active < game.totalFugitives ? ` &middot; Left <b>${active}</b>` : '');
    }

    function clearPhaseTimer() {
      if (phaseTimer !== null) {
        window.clearTimeout(phaseTimer);
        phaseTimer = null;
      }
    }

    function newGame() {
      token += 1;
      running = false;
      clearPhaseTimer();
      const settings = readSettings();
      saveSettings(settings);
      updateSetupSummary();
      game = new Game(rng, settings);
      game.newGame();
      lastRound = 1;
      view.copVisuals.clear();
      view.fugitiveVisuals.clear();
      for (const cop of game.cops) view.copVisuals.set(cop.id, { x: cop.x, y: cop.y });
      for (const fugitive of game.fugitives) view.fugitiveVisuals.set(fugitive.id, { x: fugitive.x, y: fugitive.y });
      view.nudge = { id: null, x: 0, y: 0 };
      view.hover = null;
      view.restFlash = 0;
      els.overlay.classList.remove('open');
      els.overlay.setAttribute('aria-hidden', 'true');
      els.card.classList.remove('lose');
      els.turn.textContent = '1';
      updateHud();
      syncVisuals(true);
      resizeCanvas();
      if (game.phase === 'fugitives') {
        startFugitivePhase();
      } else {
        updateCopMessage();
      }
    }

    function restart() {
      els.restart.blur();
      els.again.blur();
      newGame();
    }

    function syncVisuals(instant = false) {
      const living = new Set();
      for (const fugitive of game.fugitives) {
        if (fugitive.status !== 'active') continue;
        living.add(fugitive.id);
        const visual = view.fugitiveVisuals.get(fugitive.id);
        if (!visual) {
          view.fugitiveVisuals.set(fugitive.id, { x: fugitive.x, y: fugitive.y });
        } else if (instant) {
          visual.x = fugitive.x;
          visual.y = fugitive.y;
        }
      }
      for (const id of [...view.fugitiveVisuals.keys()]) {
        if (!living.has(id)) view.fugitiveVisuals.delete(id);
      }

      for (const cop of game.cops) {
        const visual = view.copVisuals.get(cop.id);
        if (!visual) {
          view.copVisuals.set(cop.id, { x: cop.x, y: cop.y });
        } else if (instant) {
          visual.x = cop.x;
          visual.y = cop.y;
        }
      }
    }

    function updateCopMessage() {
      if (!game || game.phase !== 'cops') return;
      const left = game.cops.filter((cop) => !cop.moved).length;
      if (left === game.cops.length) {
        setStatus('Move each hunter once, then the fugitives run.');
      } else if (left > 0) {
        setStatus(`${left} hunter${left === 1 ? '' : 's'} left to move this round.`);
      }
    }

    function startFugitivePhase() {
      if (!game || running || game.phase !== 'fugitives') return;
      running = true;
      const myToken = ++token;
      clearPhaseTimer();

      if (game.resting) {
        view.restFlash = 1.4;
        setStatus(plural(
          'The fugitive is exhausted and loses this round.',
          'The fugitives are exhausted and lose this round.'
        ));
        phaseTimer = window.setTimeout(() => {
          if (myToken !== token) return;
          running = false;
          const over = game.endFugitivePhase();
          updateHud();
          syncVisuals();
          if (over || game.phase === 'over') {
            scheduleResult();
          } else if (game.phase === 'fugitives') {
            startFugitivePhase();
          } else {
            updateCopMessage();
          }
        }, 900);
        return;
      }

      setStatus(plural('The fugitive is on the move...', 'The fugitives are on the move...'));

      const step = () => {
        if (myToken !== token) return;
        const result = game.stepFugitive();
        if (!result) {
          running = false;
          const over = game.endFugitivePhase();
          updateHud();
          syncVisuals();
          if (over || game.phase === 'over') {
            scheduleResult();
          } else if (game.phase === 'fugitives') {
            startFugitivePhase();
          } else {
            updateCopMessage();
          }
          return;
        }

        syncVisuals();
        if (result.kind === 'escaped') {
          updateHud();
          setStatus(`A fugitive escaped! ${game.activeFugitives().length} still out there.`);
        }
        if (game.phase === 'over') {
          running = false;
          updateHud();
          scheduleResult();
          return;
        }
        phaseTimer = window.setTimeout(step, 230);
      };

      phaseTimer = window.setTimeout(step, 300);
    }

    function performMove(dx, dy) {
      if (!game || game.phase !== 'cops') return;
      const before = game.copById(game.selectedCopId);
      const result = game.moveSelected(dx, dy);

      if (result.kind === 'blocked') {
        view.nudge = { id: before ? before.id : null, x: dx * 8, y: dy * 8 };
        return;
      }
      if (result.kind === 'ignored') return;

      syncVisuals();
      updateHud();

      if (game.phase === 'over') {
        scheduleResult();
        return;
      }

      if (result.captured) {
        const left = game.activeFugitives().length;
        setStatus(left > 0 ? `Fugitive caught! ${left} still out there.` : 'Every fugitive is caught.');
      } else {
        updateCopMessage();
      }

      if (game.phase === 'fugitives') {
        startFugitivePhase();
      }
    }

    function selectCop(id) {
      if (!game || game.phase !== 'cops') return;
      if (game.selectCop(id)) {
        updateCopMessage();
      }
    }

    function scheduleResult() {
      if (!game) return;
      const myToken = token;
      updateHud();
      setStatus(game.outcome === 'cops' ? 'Case closed.' : 'At least one fugitive got away.');
      clearPhaseTimer();
      phaseTimer = window.setTimeout(() => {
        if (myToken !== token) return;
        showResult();
      }, 380);
    }

    function showResult() {
      const won = game.outcome === 'cops';
      els.card.classList.toggle('lose', !won);
      els.resultTitle.textContent = won ? 'CAUGHT' : 'ESCAPED';
      const rounds = `${game.round} round${game.round === 1 ? '' : 's'}`;
      els.resultMessage.textContent = won
        ? `All ${game.totalFugitives} fugitive${game.totalFugitives === 1 ? '' : 's'} caught in ${rounds}.`
        : `${game.caught} of ${game.totalFugitives} caught, ${game.escaped} escaped after ${rounds}.`;
      els.overlay.classList.add('open');
      els.overlay.setAttribute('aria-hidden', 'false');
      els.again.focus({ preventScroll: true });
    }

    function directionForKey(event) {
      switch (event.key) {
        case 'ArrowUp': case 'w': case 'W': return [0, -1];
        case 'ArrowRight': case 'd': case 'D': return [1, 0];
        case 'ArrowDown': case 's': case 'S': return [0, 1];
        case 'ArrowLeft': case 'a': case 'A': return [-1, 0];
        default: break;
      }
      switch (event.code) {
        case 'KeyW': return [0, -1];
        case 'KeyD': return [1, 0];
        case 'KeyS': return [0, 1];
        case 'KeyA': return [-1, 0];
        default: return null;
      }
    }

    window.addEventListener('keydown', (event) => {
      if (event.defaultPrevented || event.repeat) return;
      const active = document.activeElement;
      if (active && (active.tagName === 'SELECT' || active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
        return;
      }
      if (event.key === 'r' || event.key === 'R') {
        event.preventDefault();
        restart();
        return;
      }
      if (/^[1-5]$/.test(event.key) && game) {
        const cop = game.cops[Number(event.key) - 1];
        if (cop) selectCop(cop.id);
        return;
      }
      const direction = directionForKey(event);
      if (!direction) return;
      event.preventDefault();
      performMove(direction[0], direction[1]);
    });

    els.restart.addEventListener('click', restart);
    els.again.addEventListener('click', restart);
    els.apply.addEventListener('click', () => {
      els.apply.blur();
      newGame();
      if (window.matchMedia('(max-width: 760px)').matches) els.setup.open = false;
    });

    els.hunters.addEventListener('change', updateSetupSummary);
    els.fugitives.addEventListener('change', updateSetupSummary);

    els.difficulty.addEventListener('change', () => {
      if (!game) return;
      const difficulty = Number(els.difficulty.value);
      game.setDifficulty(difficulty);
      const info = DIFFICULTY[difficulty];
      setStatus(`Difficulty ${info.name} - ${info.hint}`);
      saveSettings(readSettings());
      els.difficulty.blur();
    });

    els.walls.addEventListener('input', () => {
      els.wallsValue.textContent = `${els.walls.value}%`;
      updateSetupSummary();
    });

    const padDirections = { up: [0, -1], right: [1, 0], down: [0, 1], left: [-1, 0] };
    document.querySelectorAll('.touchpad button').forEach((button) => {
      button.addEventListener('click', () => {
        performMove(padDirections[button.dataset.move][0], padDirections[button.dataset.move][1]);
        button.blur();
      });
    });

    function cellFromEvent(event) {
      const rect = els.canvas.getBoundingClientRect();
      const px = event.clientX - rect.left;
      const py = event.clientY - rect.top;
      if (!view.cell) return null;
      const x = Math.floor((px - view.ox) / view.cell);
      const y = Math.floor((py - view.oy) / view.cell);
      if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return null;
      return { x, y };
    }

    function handleCell(cell) {
      if (!game || game.phase !== 'cops') return;
      const cop = game.copAt(cell.x, cell.y);
      if (cop) {
        if (!cop.moved) selectCop(cop.id);
        return;
      }
      const selected = game.copById(game.selectedCopId);
      if (!selected) return;
      const dx = cell.x - selected.x;
      const dy = cell.y - selected.y;
      if (Math.abs(dx) + Math.abs(dy) !== 1) return;
      performMove(dx, dy);
    }

    els.canvas.addEventListener('pointerdown', (event) => {
      if (event.button !== undefined && event.button !== 0) return;
      dragStart = { x: event.clientX, y: event.clientY };
      if (els.canvas.setPointerCapture) {
        try { els.canvas.setPointerCapture(event.pointerId); } catch (error) { /* ignore */ }
      }
    });

    els.canvas.addEventListener('pointerup', (event) => {
      if (!dragStart) return;
      const dx = event.clientX - dragStart.x;
      const dy = event.clientY - dragStart.y;
      dragStart = null;

      if (Math.hypot(dx, dy) >= 24) {
        if (Math.abs(dx) >= Math.abs(dy)) performMove(dx > 0 ? 1 : -1, 0);
        else performMove(0, dy > 0 ? 1 : -1);
        return;
      }
      const cell = cellFromEvent(event);
      if (cell) handleCell(cell);
    });

    els.canvas.addEventListener('pointercancel', () => { dragStart = null; });

    els.canvas.addEventListener('pointermove', (event) => {
      if (event.pointerType !== 'mouse') return;
      view.hover = cellFromEvent(event);
    });

    els.canvas.addEventListener('pointerleave', () => { view.hover = null; });

    function resizeCanvas() {
      const rect = els.canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.max(1, Math.round(rect.width));
      const height = Math.max(1, Math.round(rect.height));
      const pixelWidth = Math.round(width * dpr);
      const pixelHeight = Math.round(height * dpr);
      if (els.canvas.width !== pixelWidth || els.canvas.height !== pixelHeight) {
        els.canvas.width = pixelWidth;
        els.canvas.height = pixelHeight;
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      view.w = width;
      view.h = height;
    }

    if (typeof ResizeObserver === 'function') {
      new ResizeObserver(resizeCanvas).observe(els.canvas);
    }
    window.addEventListener('resize', resizeCanvas);

    function roundRectPath(x, y, w, h, radius) {
      const r = Math.min(radius, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function fillRound(x, y, w, h, radius, color) {
      roundRectPath(x, y, w, h, radius);
      ctx.fillStyle = color;
      ctx.fill();
    }

    function strokeRound(x, y, w, h, radius, color, lineWidth) {
      roundRectPath(x, y, w, h, radius);
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.stroke();
    }

    function drawExit(cx, cy, cell) {
      const pulse = 0.5 + 0.5 * Math.sin(view.time * 2.4);
      const radius = cell * (0.29 + 0.02 * pulse);

      ctx.beginPath();
      ctx.arc(cx, cy, radius * 1.6, 0, TAU);
      ctx.fillStyle = `rgba(102, 250, 159, ${0.05 + 0.04 * pulse})`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, TAU);
      ctx.fillStyle = COLORS.exitFill;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, TAU);
      ctx.strokeStyle = `rgba(102, 250, 159, ${0.55 + 0.25 * pulse})`;
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = COLORS.exitGlyph;
      ctx.font = `800 ${Math.round(radius * 1.2)}px ${FONT}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('E', cx, cy + radius * 0.06);
    }

    function drawTile(cx, cy, cell, ox, oy) {
      const x = ox + cx * cell;
      const y = oy + cy * cell;
      const tile = game.grid.tile(cx, cy);

      if (tile === TILE.WALL) {
        const margin = Math.max(2, cell * 0.045);
        const size = cell - margin * 2;
        fillRound(x + margin, y + margin, size, size, Math.min(8, cell * 0.12), COLORS.wall);
        strokeRound(x + margin, y + margin, size, size, Math.min(8, cell * 0.12), COLORS.wallEdge, 1);
        return;
      }

      const inset = Math.max(1, cell * 0.018);
      fillRound(
        x + inset,
        y + inset,
        cell - inset * 2,
        cell - inset * 2,
        Math.min(5, cell * 0.075),
        (cx + cy) % 2 === 0 ? COLORS.floorA : COLORS.floorB
      );

      if (tile === TILE.EXIT) drawExit(x + cell / 2, y + cell / 2, cell);
    }

    function drawActor(position, color, letter, cell, ox, oy, alpha = 1, offsetX = 0, offsetY = 0) {
      const cx = ox + (position.x + 0.5) * cell + offsetX;
      const cy = oy + (position.y + 0.5) * cell + offsetY;
      const radius = cell * 0.32;

      ctx.save();
      ctx.globalAlpha = alpha;

      ctx.beginPath();
      ctx.ellipse(cx, cy + radius * 0.14, radius * 1.02, radius * 0.98, 0, 0, TAU);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, TAU);
      ctx.fillStyle = color;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx, cy, radius * 0.82, 0, TAU);
      ctx.fillStyle = shade(color, 1.16);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, TAU);
      ctx.strokeStyle = shade(color, 0.7);
      ctx.lineWidth = Math.max(1.5, cell * 0.028);
      ctx.stroke();

      ctx.fillStyle = COLORS.ink;
      ctx.font = `800 ${Math.round(radius * 1.15)}px ${FONT}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(letter, cx, cy + radius * 0.06);
      ctx.restore();
    }

    function drawSelection(visual, cell, ox, oy, pulse) {
      const cx = ox + (visual.x + 0.5) * cell;
      const cy = oy + (visual.y + 0.5) * cell;
      const radius = cell * (0.4 + 0.03 * pulse);
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, TAU);
      ctx.strokeStyle = COLORS.selected;
      ctx.lineWidth = Math.max(2, cell * 0.04);
      ctx.stroke();
    }

    function drawMoveDots(cop, cell, ox, oy) {
      for (const target of game.copTargets(cop)) {
        const cx = ox + (target.x + 0.5) * cell;
        const cy = oy + (target.y + 0.5) * cell;
        ctx.beginPath();
        ctx.arc(cx, cy, Math.max(2, cell * 0.07), 0, TAU);
        ctx.fillStyle = 'rgba(90, 209, 255, 0.5)';
        ctx.fill();
      }
    }

    function draw() {
      if (!game || view.w <= 0 || view.h <= 0) return;
      ctx.clearRect(0, 0, view.w, view.h);

      const pad = 4;
      const cell = Math.min((view.w - pad * 2) / COLS, (view.h - pad * 2) / ROWS);
      if (!(cell > 2)) return;

      const boardW = cell * COLS;
      const boardH = cell * ROWS;
      const ox = (view.w - boardW) / 2;
      const oy = (view.h - boardH) / 2;
      view.cell = cell;
      view.ox = ox;
      view.oy = oy;

      fillRound(ox, oy, boardW, boardH, 10, COLORS.bed);

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) drawTile(x, y, cell, ox, oy);
      }

      const selected = game.phase === 'cops' ? game.copById(game.selectedCopId) : null;

      if (selected) drawMoveDots(selected, cell, ox, oy);

      if (view.hover && game.phase === 'cops') {
        const dx = view.hover.x - (selected ? selected.x : -9);
        const dy = view.hover.y - (selected ? selected.y : -9);
        if (selected && Math.abs(dx) + Math.abs(dy) === 1 && game.grid.isWalkable(view.hover.x, view.hover.y)) {
          const margin = Math.max(2, cell * 0.03);
          strokeRound(
            ox + view.hover.x * cell + margin,
            oy + view.hover.y * cell + margin,
            cell - margin * 2,
            cell - margin * 2,
            Math.min(8, cell * 0.12),
            COLORS.hover,
            2
          );
        }
      }

      for (const fugitive of game.fugitives) {
        if (fugitive.status !== 'active') continue;
        const visual = view.fugitiveVisuals.get(fugitive.id);
        if (visual) drawActor(visual, COLORS.fugitive, 'F', cell, ox, oy);
      }

      for (const cop of game.cops) {
        const visual = view.copVisuals.get(cop.id);
        if (!visual) continue;
        const dim = game.phase === 'cops' && cop.moved ? 0.55 : 1;
        const nudged = view.nudge.id === cop.id;
        drawActor(
          visual, COLORS.hunter, 'H', cell, ox, oy, dim,
          nudged ? view.nudge.x : 0,
          nudged ? view.nudge.y : 0
        );
      }

      if (selected) {
        const pulse = 0.5 + 0.5 * Math.sin(view.time * 3.2);
        const visual = view.copVisuals.get(selected.id);
        if (visual) drawSelection(visual, cell, ox, oy, pulse);
      }

      if (view.restFlash > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, view.restFlash);
        ctx.fillStyle = '#a9bcd8';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (const fugitive of game.activeFugitives()) {
          const visual = view.fugitiveVisuals.get(fugitive.id);
          if (!visual) continue;
          const cx = ox + (visual.x + 0.5) * cell;
          const cy = oy + (visual.y + 0.5) * cell - cell * 0.6;
          ctx.font = `700 ${Math.round(cell * 0.3)}px ${FONT}`;
          ctx.fillText('z', cx + cell * 0.22, cy + cell * 0.18);
          ctx.font = `700 ${Math.round(cell * 0.22)}px ${FONT}`;
          ctx.fillText('z', cx + cell * 0.4, cy - cell * 0.1);
        }
        ctx.restore();
      }
    }

    function update(delta) {
      if (!game) return;
      const weight = 1 - Math.exp(-18 * delta);

      for (const fugitive of game.fugitives) {
        if (fugitive.status !== 'active') continue;
        const visual = view.fugitiveVisuals.get(fugitive.id);
        if (!visual) continue;
        visual.x += (fugitive.x - visual.x) * weight;
        visual.y += (fugitive.y - visual.y) * weight;
        if (Math.abs(fugitive.x - visual.x) < 0.004) visual.x = fugitive.x;
        if (Math.abs(fugitive.y - visual.y) < 0.004) visual.y = fugitive.y;
      }

      for (const cop of game.cops) {
        const visual = view.copVisuals.get(cop.id);
        if (!visual) continue;
        visual.x += (cop.x - visual.x) * weight;
        visual.y += (cop.y - visual.y) * weight;
        if (Math.abs(cop.x - visual.x) < 0.004) visual.x = cop.x;
        if (Math.abs(cop.y - visual.y) < 0.004) visual.y = cop.y;
      }

      const decay = Math.exp(-10 * delta);
      view.nudge.x *= decay;
      view.nudge.y *= decay;
      if (Math.hypot(view.nudge.x, view.nudge.y) < 0.5) view.nudge = { id: null, x: 0, y: 0 };

      view.restFlash = Math.max(0, view.restFlash - delta * 1.1);
    }

    function loop(now) {
      const delta = Math.min((now - lastFrame) / 1000, 0.05);
      lastFrame = now;
      view.time += delta;
      update(delta);
      draw();
      requestAnimationFrame(loop);
    }

    const saved = loadSettings();
    applySettingsToControls(saved);
    updateSetupSummary();
    if (window.matchMedia('(max-width: 760px)').matches) els.setup.open = false;
    newGame();
    requestAnimationFrame(loop);

    window.__escapeHunter = {
      get game() { return game; },
      Grid,
      Pathfinding,
      Game,
      input: performMove,
      restart,
      newGame,
      settings: readSettings
    };
  }

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = {
      Grid, Pathfinding, MapGenerator, FugitiveAI, Game,
      AI, TILE, DIRS, same, manhattan, chebyshev, makeRng, COLS, ROWS, MAX_ACTORS
    };
  } else if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initUI, { once: true });
    } else {
      initUI();
    }
  }
})();
</script>
</body>
</html>
